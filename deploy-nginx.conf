# ---------------------------------------------------------------------------
# hamitdincel.com — nginx reverse proxy
#
# Sunucuya kopyalayın:
#   sudo cp deploy-nginx.conf /etc/nginx/sites-available/hamitdincel
#   sudo ln -s /etc/nginx/sites-available/hamitdincel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS'i certbot ekler (aşağıdaki 443 bloğunu kendisi yazar):
#   sudo certbot --nginx -d hamitdincel.com -d www.hamitdincel.com
#
# Node uygulaması 127.0.0.1:3000'de dinliyor olmalı (bkz. ecosystem.config.cjs).
# ---------------------------------------------------------------------------

# www → köke kalıcı yönlendirme (tek kanonik adres, SEO için önemli)
server {
    listen 80;
    listen [::]:80;
    server_name www.hamitdincel.com;
    return 301 https://hamitdincel.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name hamitdincel.com;

    # certbot bu bloğu 443'e taşıyıp buraya http→https yönlendirmesi ekleyecek

    # Yükleme boyutu: sitede form yok, küçük tutmak saldırı yüzeyini daraltır
    client_max_body_size 2m;

    # Metin varlıklarını sıkıştır (görseller zaten sıkışık)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ---------------------------------------------------------------------
    # Derlenmiş varlıklar: içerik hash'li oldukları için sonsuza dek önbellek.
    # Doğrudan diskten servis etmek Node'u bu isteklerden tamamen kurtarır.
    # ---------------------------------------------------------------------
    location /_next/static/ {
        alias /var/www/hamitdincel/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # public/ altındaki görseller — hash'siz oldukları için daha kısa süre
    location /images/ {
        alias /var/www/hamitdincel/public/images/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---------------------------------------------------------------------
    # Geri kalan her şey Next.js'e
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
